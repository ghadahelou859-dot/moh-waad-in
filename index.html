<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة محمد ووعد</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#eee7dd;
}

body{
  overflow:hidden;
}

/* ==============================
   الحاوية الرئيسية
============================== */

.invitation{
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;

  position:relative;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  background:#f4ecdf;

  scrollbar-width:none;
}

.invitation::-webkit-scrollbar{
  display:none;
}


/* ==============================
   كل صفحة
============================== */

.page{
  position:relative;

  width:100%;
  height:100vh;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;

  background:#f4ecdf;
}

.page img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* ==============================
   الغلاف
============================== */

#coverPage{
  position:relative;
  z-index:50;

  transition:
    transform 1s cubic-bezier(.77,0,.18,1),
    opacity .8s ease;
}


/* الغلاف عند الفتح */

#coverPage.opening{

  transform:
    translateY(-105%)
    scale(.96);

  opacity:.15;

}


/* طبقة خفيفة وقت الضغط */

.cover-glow{

  position:absolute;
  inset:0;

  z-index:10;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 49%,
      rgba(212,170,80,.18),
      transparent 23%
    );

  opacity:0;

  transition:.45s;
}


/* تظهر حول الختم */

#coverPage.preparing .cover-glow{

  opacity:1;

}


/* منطقة الضغط */

.open-cover{

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  border:0;
  background:transparent;

  z-index:30;

  cursor:pointer;

}


/* دائرة وهمية فوق الختم
   لإعطاء حركة عند الضغط */

.seal-effect{

  position:absolute;

  left:50%;
  top:50%;

  width:95px;
  height:95px;

  transform:
    translate(-50%,-50%)
    scale(.8);

  border-radius:50%;

  border:1px solid
    rgba(178,127,39,.45);

  opacity:0;

  pointer-events:none;

  z-index:25;
}


#coverPage.preparing .seal-effect{

  animation:
    sealPulse .7s ease;

}


@keyframes sealPulse{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.75);
  }

  40%{
    opacity:.8;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.6);
  }

}


/* ==============================
   كرت العرس
============================== */

#weddingPage{

  transform:translateY(12%);

  opacity:.65;

  transition:
    transform 1s cubic-bezier(.22,.9,.3,1),
    opacity .9s ease;

}


/* لما تنفتح الدعوة */

body.invitation-open #weddingPage{

  transform:translateY(0);

  opacity:1;

}


/* ==============================
   زر الموسيقى
============================== */

.music-button{

  position:fixed;

  top:18px;
  right:18px;

  z-index:1000;

  width:46px;
  height:46px;

  border-radius:50%;

  border:
    1px solid rgba(169,123,41,.55);

  background:
    rgba(255,248,236,.92);

  color:#916519;

  font-size:21px;

  display:none;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.13);

  backdrop-filter:blur(5px);

}


.music-button.visible{

  display:flex;

}


/* ==============================
   مؤشر السحب
============================== */

.swipe-hint{

  position:fixed;

  bottom:16px;
  left:50%;

  transform:
    translateX(-50%);

  z-index:900;

  display:none;

  flex-direction:column;
  align-items:center;

  padding:
    7px 14px;

  border-radius:25px;

  background:
    rgba(255,248,236,.88);

  color:#8d651e;

  font-size:12px;

  pointer-events:none;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.09);

  animation:
    hintMove 1.4s infinite;

}


.swipe-hint.visible{

  display:flex;

}


.swipe-hint strong{

  font-size:21px;

  line-height:16px;

  font-weight:normal;

}


@keyframes hintMove{

  0%,100%{

    transform:
      translateX(-50%)
      translateY(0);

  }

  50%{

    transform:
      translateX(-50%)
      translateY(-7px);

  }

}


/* ==============================
   نقاط الصفحات
============================== */

.dots{

  position:fixed;

  right:13px;
  top:50%;

  transform:
    translateY(-50%);

  z-index:900;

  display:none;

  flex-direction:column;

  gap:9px;

}


.dots.visible{

  display:flex;

}


.dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:
    rgba(142,101,29,.28);

  transition:.3s;

  cursor:pointer;

}


.dot.active{

  background:#95681c;

  transform:scale(1.4);

}


/* ==============================
   زر الموقع
============================== */

.map-button{

  position:absolute;

  left:27%;
  width:46%;

  top:72%;
  height:9%;

  z-index:40;

  border:0;

  background:transparent;

  cursor:pointer;

}


/* ==============================
   كمبيوتر
============================== */

@media(min-width:501px){

  body{

    background:#ebe5dc;

  }

  .invitation{

    box-shadow:
      0 0 30px
      rgba(0,0,0,.12);

  }

}

</style>
</head>


<body>


<main
class="invitation"
id="invitation"
>


<!-- ===================================
     1 الغلاف
=================================== -->

<section
class="page"
id="coverPage"
>

<img
src="cover.png"
alt="غلاف دعوة محمد ووعد"
>


<div
class="cover-glow">
</div>


<div
class="seal-effect">
</div>


<button
class="open-cover"
id="openCover"
aria-label="فتح الدعوة">
</button>

</section>



<!-- ===================================
     2 العرس
=================================== -->

<section
class="page"
id="weddingPage"
>

<img
src="wedding.png"
alt="معلومات حفل الزفاف"
>

</section>



<!-- ===================================
     3 الحنة
=================================== -->

<section
class="page"
id="hennaPage"
>

<img
src="hanna2.png"
alt="ليلة الحنة"
>

</section>



<!-- ===================================
     4 العد التنازلي والموقع
=================================== -->

<section
class="page"
id="countdownPage"
>

<img
src="countdown.png"
alt="العد التنازلي وموقع العرس"
>


<button
class="map-button"
id="mapButton"
aria-label="فتح موقع العرس">
</button>

</section>


</main>



<!-- ===================================
     الموسيقى
=================================== -->

<audio
id="music"
loop
preload="auto"
>

<source
src="music35.mp3"
type="audio/mpeg">

</audio>


<button
class="music-button"
id="musicButton"
aria-label="تشغيل أو إيقاف الموسيقى"
>
♫
</button>



<!-- ===================================
     اسحب للأعلى
=================================== -->

<div
class="swipe-hint"
id="swipeHint"
>

<strong>↑</strong>

<span>
اسحب للأعلى
</span>

</div>



<!-- ===================================
     النقاط
=================================== -->

<div
class="dots"
id="dots"
>

<span class="dot active"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>



<script>

/* ===================================
   العناصر
=================================== */

const invitation =
document.getElementById(
  "invitation"
);

const coverPage =
document.getElementById(
  "coverPage"
);

const openCover =
document.getElementById(
  "openCover"
);

const weddingPage =
document.getElementById(
  "weddingPage"
);

const music =
document.getElementById(
  "music"
);

const musicButton =
document.getElementById(
  "musicButton"
);

const swipeHint =
document.getElementById(
  "swipeHint"
);

const dotsBox =
document.getElementById(
  "dots"
);

const dots =
document.querySelectorAll(
  ".dot"
);


let opened = false;


/* ===================================
   فتح الغلاف
=================================== */

openCover.addEventListener(
"click",
function(){

  if(opened){
    return;
  }


  opened = true;


  /* حركة الختم */

  coverPage
  .classList
  .add("preparing");


  /* تشغيل الموسيقى */

  music.volume = .45;

  music.play()
  .catch(function(){

    console.log(
      "المتصفح منع تشغيل الموسيقى"
    );

  });


  /* بعد حركة الختم */

  setTimeout(
  function(){


    document.body
    .classList
    .add(
      "invitation-open"
    );


    coverPage
    .classList
    .add(
      "opening"
    );


    /* إظهار عناصر التحكم */

    musicButton
    .classList
    .add(
      "visible"
    );


    dotsBox
    .classList
    .add(
      "visible"
    );


  },
  450
  );


  /* انتقال لكرت العرس */

  setTimeout(
  function(){


    weddingPage
    .scrollIntoView({

      behavior:"smooth",

      block:"start"

    });


    swipeHint
    .classList
    .add(
      "visible"
    );


  },
  950
  );

});


/* ===================================
   الموسيقى
=================================== */

musicButton
.addEventListener(
"click",
function(){


  if(
    music.paused
  ){

    music.play();

    musicButton
    .textContent="♫";

  }


  else{

    music.pause();

    musicButton
    .textContent="♪";

  }

});


/* ===================================
   متابعة الصفحة الحالية
=================================== */

invitation
.addEventListener(
"scroll",
function(){


  if(!opened){
    return;
  }


  const pageHeight =
  invitation.clientHeight;


  const page =
  Math.round(

    invitation.scrollTop
    /
    pageHeight

  );


  dots.forEach(
  function(dot){

    dot
    .classList
    .remove(
      "active"
    );

  });


  /*
  العرس = صفحة 1
  الحنة = صفحة 2
  الموقع = صفحة 3
  */


  if(page >= 1){

    const index =
    page - 1;


    if(
      dots[index]
    ){

      dots[index]
      .classList
      .add(
        "active"
      );

    }

  }


  /* آخر صفحة */

  if(page >= 3){

    swipeHint
    .classList
    .remove(
      "visible"
    );

  }


  else if(page >= 1){

    swipeHint
    .classList
    .add(
      "visible"
    );

  }

});


/* ===================================
   النقاط
=================================== */

dots.forEach(
function(dot,index){


  dot
  .addEventListener(
  "click",
  function(){


    const page =
    index + 1;


    invitation
    .scrollTo({

      top:
      page *
      invitation.clientHeight,

      behavior:
      "smooth"

    });

  });

});


/* ===================================
   الموقع
=================================== */

document
.getElementById(
  "mapButton"
)
.addEventListener(
"click",
function(){


  window.open(

    "https://www.google.com/maps/search/?api=1&query=Ramallah",

    "_blank"

  );

});

</script>


</body>
</html>
