<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دعوة محمد ووعد</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #f4ecdf;
      font-family: Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .invitation {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      position: relative;
      background: #f4ecdf;
      overflow: hidden;
    }

    /* الصفحات */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .page.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* الصور */
    .page-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* الغلاف */
    #coverPage {
      cursor: pointer;
    }

    .open-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 20;
    }

    /* الأسهم */
    .arrow {
      position: fixed;
      bottom: 22px;
      z-index: 1000;

      width: 48px;
      height: 48px;

      border-radius: 50%;
      border: 1px solid rgba(160, 115, 35, 0.45);

      background: rgba(255, 248, 235, 0.95);
      color: #94681b;

      font-size: 27px;
      cursor: pointer;

      display: none;
      align-items: center;
      justify-content: center;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }

    .arrow.visible {
      display: flex;
    }

    #prev {
      right: 18px;
    }

    #next {
      left: 18px;
    }

    /* نقاط الصفحات */
    .dots {
      position: fixed;
      bottom: 39px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 1000;

      display: none;
      gap: 9px;
    }

    .dots.visible {
      display: flex;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d5bd91;
      transition: 0.25s;
    }

    .dot.active {
      background: #986b1e;
      transform: scale(1.4);
    }

    /* الموسيقى */
    .music-button {
      position: fixed;
      top: 18px;
      right: 18px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      border-radius: 50%;
      border: 1px solid #c89b4c;

      background: rgba(255, 248, 235, 0.95);
      color: #966b20;

      font-size: 21px;
      cursor: pointer;

      display: none;
      align-items: center;
      justify-content: center;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .music-button.visible {
      display: flex;
    }

    /* زر الموقع الشفاف */
    #countdownPage {
      position: relative;
    }

    .map-button {
      position: absolute;

      left: 27%;
      width: 46%;

      top: 72%;
      height: 9%;

      z-index: 30;

      border: 0;
      background: transparent;
      cursor: pointer;
    }

    @media (min-width: 501px) {
      body {
        background: #eee8df;
      }

      .invitation {
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>


<body>

  <main class="invitation">


    <!-- الصفحة 1: الغلاف -->

    <section class="page active" id="coverPage">

      <img
        src="cover.png"
        class="page-image"
        alt="غلاف دعوة محمد ووعد"
      >

      <button
        class="open-cover"
        id="openCover"
        aria-label="فتح الدعوة"
      ></button>

    </section>


    <!-- الصفحة 2: العرس -->

    <section class="page" id="weddingPage">

      <img
        src="wedding.png"
        class="page-image"
        alt="حفل زفاف محمد ووعد"
      >

    </section>


    <!-- الصفحة 3: الحنة -->

    <section class="page" id="hennaPage">

      <img
        src="حناء.png"
        class="page-image"
        alt="ليلة الحنة"
      >

    </section>


    <!-- الصفحة 4: الموقع والعد التنازلي -->

    <section class="page" id="countdownPage">

      <img
        src="countdown.png"
        class="page-image"
        alt="العد التنازلي وموقع العرس"
      >

      <button
        class="map-button"
        id="mapButton"
        aria-label="فتح موقع العرس"
      ></button>

    </section>


    <!-- الموسيقى -->

    <audio id="music" loop preload="auto">

      <source
        src="موسيقى.mp3"
        type="audio/mpeg"
      >

    </audio>


    <!-- زر الموسيقى -->

    <button
      class="music-button"
      id="musicButton"
      aria-label="تشغيل أو إيقاف الموسيقى"
    >
      ♫
    </button>


    <!-- زر السابق -->

    <button
      class="arrow"
      id="prev"
      aria-label="الصفحة السابقة"
    >
      ›
    </button>


    <!-- زر التالي -->

    <button
      class="arrow"
      id="next"
      aria-label="الصفحة التالية"
    >
      ‹
    </button>


    <!-- النقاط -->

    <div class="dots" id="dots">

      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>


  </main>


  <script>

    /* الصفحات */

    const pages = [
      document.getElementById("coverPage"),
      document.getElementById("weddingPage"),
      document.getElementById("hennaPage"),
      document.getElementById("countdownPage")
    ];


    let currentPage = 0;


    /* العناصر */

    const openCover =
      document.getElementById("openCover");

    const prevButton =
      document.getElementById("prev");

    const nextButton =
      document.getElementById("next");

    const dotsBox =
      document.getElementById("dots");

    const dots =
      document.querySelectorAll(".dot");

    const music =
      document.getElementById("music");

    const musicButton =
      document.getElementById("musicButton");


    /* فتح الدعوة */

    openCover.addEventListener("click", function () {

      showPage(1);

      prevButton.classList.add("visible");
      nextButton.classList.add("visible");
      dotsBox.classList.add("visible");
      musicButton.classList.add("visible");

      music.volume = 0.45;

      music.play().catch(function () {
        console.log("المتصفح منع تشغيل الموسيقى تلقائياً");
      });

    });


    /* عرض الصفحة */

    function showPage(pageNumber) {

      pages.forEach(function (page) {
        page.classList.remove("active");
      });


      pages[pageNumber].classList.add("active");

      currentPage = pageNumber;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      updateControls();

    }


    /* التالي */

    nextButton.addEventListener("click", function () {

      if (currentPage < pages.length - 1) {
        showPage(currentPage + 1);
      }

    });


    /* السابق */

    prevButton.addEventListener("click", function () {

      if (currentPage > 1) {
        showPage(currentPage - 1);
      }

    });


    /* تحديث الأسهم والنقاط */

    function updateControls() {

      if (currentPage === 1) {
        prevButton.style.visibility = "hidden";
      } else {
        prevButton.style.visibility = "visible";
      }


      if (currentPage === pages.length - 1) {
        nextButton.style.visibility = "hidden";
      } else {
        nextButton.style.visibility = "visible";
      }


      dots.forEach(function (dot) {
        dot.classList.remove("active");
      });


      const dotNumber = currentPage - 1;

      if (dots[dotNumber]) {
        dots[dotNumber].classList.add("active");
      }

    }


    /* تشغيل وإيقاف الموسيقى */

    musicButton.addEventListener("click", function () {

      if (music.paused) {

        music.play();

        musicButton.textContent = "♫";

      } else {

        music.pause();

        musicButton.textContent = "♪";

      }

    });


    /* فتح الموقع */

    document
      .getElementById("mapButton")
      .addEventListener("click", function () {

        window.open(
          "https://www.google.com/maps/search/?api=1&query=Ramallah",
          "_blank"
        );

      });


    /* السحب بالموبايل */

    let touchStartX = 0;


    document.addEventListener(
      "touchstart",
      function (event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function (event) {

        if (currentPage === 0) {
          return;
        }


        const touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchEndX - touchStartX;


        if (Math.abs(difference) < 60) {
          return;
        }


        if (difference < 0) {

          if (currentPage < pages.length - 1) {
            showPage(currentPage + 1);
          }

        } else {

          if (currentPage > 1) {
            showPage(currentPage - 1);
          }

        }

      },
      { passive: true }
    );

  </script>

</body>

</html>
