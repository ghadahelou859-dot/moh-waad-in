<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة محمد ووعد</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  background:#f4ecdf;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* إطار الدعوة */
.invitation{
  width:100%;
  max-width:500px;
  margin:auto;
  min-height:100vh;
  background:#f4ecdf;
  position:relative;
}

/* كل صفحة */
.page{
  display:none;
  width:100%;
  min-height:100vh;
  position:relative;
}

.page.active{
  display:block;
  animation:fade .5s ease;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

/* الصور */
.page img{
  display:block;
  width:100%;
  height:auto;
}

/* الغلاف */
#coverPage{
  cursor:pointer;
}

.open-cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  cursor:pointer;
}

/* أزرار التنقل */
.arrow{
  position:fixed;
  bottom:22px;
  z-index:999;

  width:48px;
  height:48px;

  border-radius:50%;
  border:1px solid rgba(160,115,35,.45);

  background:rgba(255,248,235,.94);
  color:#94681b;

  font-size:27px;

  display:none;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.arrow.visible{
  display:flex;
}

#prev{
  right:18px;
}

#next{
  left:18px;
}

/* نقاط الصفحات */
.dots{
  position:fixed;
  bottom:38px;
  left:50%;
  transform:translateX(-50%);

  display:none;
  gap:8px;

  z-index:999;
}

.dots.visible{
  display:flex;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#d5bd91;
}

.dot.active{
  background:#986b1e;
  transform:scale(1.35);
}

/* زر الموسيقى */
.music{
  position:fixed;
  top:18px;
  right:18px;

  z-index:999;

  width:46px;
  height:46px;

  border-radius:50%;
  border:1px solid #c89b4c;

  background:rgba(255,248,235,.94);
  color:#966b20;

  font-size:21px;

  display:none;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.music.visible{
  display:flex;
}

/* صفحة الموقع */
#countdownPage{
  position:relative;
}

/* زر شفاف فوق زر الموقع الموجود بالصورة */
.map-button{
  position:absolute;

  left:27%;
  width:46%;

  top:72%;
  height:9%;

  border:0;
  background:transparent;

  cursor:pointer;
  z-index:30;
}

/* تحسين العرض على الكمبيوتر */
@media(min-width:501px){

  body{
    background:#eee8df;
  }

  .invitation{
    box-shadow:0 0 25px rgba(0,0,0,.08);
  }

}

</style>
</head>


<body>

<div class="invitation">


<!-- =====================
     1 الغلاف
===================== -->

<section class="page active" id="coverPage">

<img
src="cover.png"
alt="دعوة محمد ووعد">

<button
class="open-cover"
id="openCover"
aria-label="فتح الدعوة">
</button>

</section>



<!-- =====================
     2 العرس
===================== -->

<section class="page" id="weddingPage">

<img
src="wedding.png"
alt="حفل زفاف محمد ووعد">

</section>



<!-- =====================
     3 الحنة
===================== -->

<section class="page" id="hennaPage">

<img
src="henna.png"
alt="ليلة الحنة">

</section>



<!-- =====================
     4 الموقع والعد
===================== -->

<section class="page" id="countdownPage">

<img
src="countdown.png"
alt="العد التنازلي وموقع العرس">

<button
class="map-button"
id="mapButton"
aria-label="فتح الموقع">
</button>

</section>



<!-- الموسيقى -->

<audio id="music" loop preload="auto">
<source src="music.mp3" type="audio/mpeg">
</audio>


<button
class="music"
id="musicButton"
aria-label="الموسيقى">
♫
</button>



<!-- الأسهم -->

<button
class="arrow"
id="prev"
aria-label="السابق">
›
</button>

<button
class="arrow"
id="next"
aria-label="التالي">
‹
</button>



<!-- نقاط الصفحات -->

<div class="dots" id="dots">

<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>


</div>



<script>

/* الصفحات */

const pages = [
document.getElementById("coverPage"),
document.getElementById("weddingPage"),
document.getElementById("hennaPage"),
document.getElementById("countdownPage")
];

let current = 0;


/* العناصر */

const openCover =
document.getElementById("openCover");

const prev =
document.getElementById("prev");

const next =
document.getElementById("next");

const dotsBox =
document.getElementById("dots");

const dots =
document.querySelectorAll(".dot");

const music =
document.getElementById("music");

const musicButton =
document.getElementById("musicButton");


/* =====================
   فتح الدعوة
===================== */

openCover.addEventListener("click",function(){

  showPage(1);

  prev.classList.add("visible");
  next.classList.add("visible");
  dotsBox.classList.add("visible");
  musicButton.classList.add("visible");

  music.volume = 0.45;

  music.play().catch(function(){
    console.log("المتصفح منع التشغيل التلقائي");
  });

});


/* =====================
   عرض صفحة
===================== */

function showPage(number){

  pages.forEach(function(page){
    page.classList.remove("active");
  });

  pages[number].classList.add("active");

  current = number;

  window.scrollTo(0,0);

  updateControls();

}


/* =====================
   التالي
===================== */

next.addEventListener("click",function(){

  if(current < 3){
    showPage(current + 1);
  }

});


/* =====================
   السابق
===================== */

prev.addEventListener("click",function(){

  if(current > 1){
    showPage(current - 1);
  }

});


/* =====================
   تحديث الأسهم والنقاط
===================== */

function updateControls(){

  if(current === 1){
    prev.style.visibility="hidden";
  }else{
    prev.style.visibility="visible";
  }


  if(current === 3){
    next.style.visibility="hidden";
  }else{
    next.style.visibility="visible";
  }


  dots.forEach(function(dot){
    dot.classList.remove("active");
  });


  if(current >= 1){

    const index = current - 1;

    if(dots[index]){
      dots[index].classList.add("active");
    }

  }

}


/* =====================
   الموسيقى
===================== */

musicButton.addEventListener("click",function(){

  if(music.paused){

    music.play();

    musicButton.innerHTML="♫";

  }else{

    music.pause();

    musicButton.innerHTML="♪";

  }

});


/* =====================
   رابط الموقع
===================== */

document
.getElementById("mapButton")
.addEventListener("click",function(){

  window.open(
  "https://www.google.com/maps/search/?api=1&query=Ramallah",
  "_blank"
  );

});


/* =====================
   السحب بالموبايل
===================== */

let startX = 0;

document.addEventListener(
"touchstart",
function(e){

  startX =
  e.changedTouches[0].screenX;

},
{passive:true}
);


document.addEventListener(
"touchend",
function(e){

  if(current === 0){
    return;
  }

  const endX =
  e.changedTouches[0].screenX;

  const distance =
  endX - startX;


  if(Math.abs(distance) < 60){
    return;
  }


  if(distance < 0){

    if(current < 3){
      showPage(current + 1);
    }

  }else{

    if(current > 1){
      showPage(current - 1);
    }

  }

},
{passive:true}
);

</script>

</body>
</html>
