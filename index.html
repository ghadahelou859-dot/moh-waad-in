<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة محمد ووعد</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,body{
  width:100%;
  height:100%;
  background:#f2e9dc;
  font-family:Arial,sans-serif;
}

/* الدعوة */
.invitation{
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  background:#f2e9dc;

  scrollbar-width:none;
}

.invitation::-webkit-scrollbar{
  display:none;
}

/* كل صفحة */
.page{
  position:relative;

  width:100%;
  height:100vh;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  background:#f2e9dc;
}

/* الصور */
.page img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   الغلاف
========================= */

.open-cover{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  border:0;
  background:transparent;

  cursor:pointer;

  z-index:20;
}

/* =========================
   زر الموسيقى
========================= */

.music-button{
  position:fixed;

  top:18px;
  right:18px;

  z-index:1000;

  width:46px;
  height:46px;

  border-radius:50%;

  border:1px solid #c89b4c;

  background:rgba(255,248,235,.94);

  color:#966b20;

  font-size:21px;

  display:none;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
  0 3px 12px rgba(0,0,0,.15);
}

.music-button.visible{
  display:flex;
}

/* =========================
   مؤشر السحب
========================= */

.swipe-hint{
  position:fixed;

  bottom:16px;
  left:50%;

  transform:translateX(-50%);

  z-index:900;

  display:none;

  flex-direction:column;
  align-items:center;

  color:#8c651f;

  font-size:12px;

  background:rgba(255,248,235,.82);

  padding:7px 13px;

  border-radius:25px;

  backdrop-filter:blur(5px);

  pointer-events:none;

  animation:moveUp 1.5s infinite;
}

.swipe-hint.visible{
  display:flex;
}

.swipe-arrow{
  font-size:20px;
  line-height:16px;
}

@keyframes moveUp{

  0%,100%{
    transform:
    translateX(-50%)
    translateY(0);
  }

  50%{
    transform:
    translateX(-50%)
    translateY(-7px);
  }

}

/* =========================
   نقاط الصفحات
========================= */

.dots{
  position:fixed;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  z-index:900;

  display:none;

  flex-direction:column;

  gap:8px;
}

.dots.visible{
  display:flex;
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:rgba(140,101,31,.3);

  transition:.3s;
}

.dot.active{
  background:#94681b;
  transform:scale(1.4);
}

/* =========================
   الموقع
========================= */

.map-button{
  position:absolute;

  left:27%;
  width:46%;

  top:72%;
  height:9%;

  border:0;

  background:transparent;

  cursor:pointer;

  z-index:30;
}

/* الكمبيوتر */
@media(min-width:501px){

  body{
    background:#e9e2d9;
  }

  .invitation{
    box-shadow:
    0 0 30px rgba(0,0,0,.12);
  }

}

</style>

</head>


<body>


<!-- =========================
     الدعوة
========================= -->

<main
class="invitation"
id="invitation"
>


<!-- =========================
     1 الغلاف
========================= -->

<section
class="page"
id="coverPage"
>

<img
src="cover.png"
alt="غلاف دعوة محمد ووعد"
>

<button
class="open-cover"
id="openCover"
aria-label="فتح الدعوة">
</button>

</section>



<!-- =========================
     2 معلومات العرس
========================= -->

<section
class="page"
id="weddingPage"
>

<img
src="wedding.png"
alt="معلومات حفل الزفاف"
>

</section>



<!-- =========================
     3 الحنة
========================= -->

<section
class="page"
id="hennaPage"
>

<img
src="حناء.png"
alt="ليلة الحنة"
>

</section>



<!-- =========================
     4 العد التنازلي والموقع
========================= -->

<section
class="page"
id="countdownPage"
>

<img
src="countdown.png"
alt="العد التنازلي وموقع العرس"
>


<button
class="map-button"
id="mapButton"
aria-label="فتح موقع العرس">
</button>

</section>


</main>



<!-- =========================
     الموسيقى
========================= -->

<audio
id="music"
loop
preload="auto"
>

<source
src="موسيقى.mp3"
type="audio/mpeg"
>

</audio>



<button
class="music-button"
id="musicButton"
aria-label="تشغيل أو إيقاف الموسيقى"
>
♫
</button>



<!-- =========================
     مؤشر اسحب للأعلى
========================= -->

<div
class="swipe-hint"
id="swipeHint"
>

<span class="swipe-arrow">
↑
</span>

<span>
اسحب للأعلى
</span>

</div>



<!-- =========================
     نقاط الصفحات
========================= -->

<div
class="dots"
id="dots"
>

<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>



<script>


/* =========================
   العناصر
========================= */

const invitation =
document.getElementById("invitation");

const openCover =
document.getElementById("openCover");

const weddingPage =
document.getElementById("weddingPage");

const music =
document.getElementById("music");

const musicButton =
document.getElementById("musicButton");

const swipeHint =
document.getElementById("swipeHint");

const dotsBox =
document.getElementById("dots");

const dots =
document.querySelectorAll(".dot");



/* =========================
   فتح الدعوة
========================= */

openCover.addEventListener(
"click",
function(){

  /* تشغيل الموسيقى */

  music.volume = 0.45;

  music.play()
  .catch(function(){

    console.log(
    "المتصفح منع تشغيل الموسيقى"
    );

  });


  /* إظهار زر الموسيقى */

  musicButton
  .classList
  .add("visible");


  /* إظهار مؤشر السحب */

  swipeHint
  .classList
  .add("visible");


  /* إظهار النقاط */

  dotsBox
  .classList
  .add("visible");


  /* الانتقال عمودياً للعرس */

  weddingPage
  .scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

});



/* =========================
   الموسيقى
========================= */

musicButton.addEventListener(
"click",
function(){

  if(music.paused){

    music.play();

    musicButton.textContent="♫";

  }

  else{

    music.pause();

    musicButton.textContent="♪";

  }

});



/* =========================
   تحديث نقاط الصفحات
========================= */

invitation.addEventListener(
"scroll",
function(){

  const pageHeight =
  invitation.clientHeight;


  const currentPage =
  Math.round(
    invitation.scrollTop /
    pageHeight
  );


  dots.forEach(
  function(dot){

    dot.classList
    .remove("active");

  });


  /*
  الغلاف لا نحسبه ضمن النقاط

  صفحة العرس = 1
  الحنة = 2
  الموقع = 3
  */


  if(currentPage >= 1){

    const dotIndex =
    currentPage - 1;


    if(dots[dotIndex]){

      dots[dotIndex]
      .classList
      .add("active");

    }

  }


  /* إخفاء عبارة اسحب للأعلى
     في الصفحة الأخيرة */

  if(currentPage >= 3){

    swipeHint
    .classList
    .remove("visible");

  }

  else if(currentPage >= 1){

    swipeHint
    .classList
    .add("visible");

  }

});



/* =========================
   الموقع
========================= */

document
.getElementById("mapButton")
.addEventListener(
"click",
function(){

  window.open(
    "https://www.google.com/maps/search/?api=1&query=Ramallah",
    "_blank"
  );

});



/* =========================
   الضغط على النقاط
========================= */

dots.forEach(
function(dot,index){

  dot.addEventListener(
  "click",
  function(){

    const targetPage =
    index + 1;


    invitation.scrollTo({

      top:
      targetPage *
      invitation.clientHeight,

      behavior:"smooth"

    });

  });

});



</script>


</body>

</html>
