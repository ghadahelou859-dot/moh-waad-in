<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة محمد ووعد</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#eee7dd;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

/* الحاوية الرئيسية */

.invitation{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;

    overflow-y:auto;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;

    background:#f4ecdf;

    scrollbar-width:none;
}

.invitation::-webkit-scrollbar{
    display:none;
}


/* كل صفحة */

.page{
    position:relative;
    width:100%;
    height:100vh;

    scroll-snap-align:start;
    scroll-snap-stop:always;

    overflow:hidden;
    background:#f4ecdf;
}

.page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =========================
   الصفحة الأولى - الغلاف
========================= */

#coverPage{
    position:relative;
    z-index:20;
}

.cover-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        transform 1.2s cubic-bezier(.77,0,.18,1),
        opacity .9s ease;
}


/* منطقة الضغط فوق الختم */

.seal-button{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    width:135px;
    height:135px;

    border:0;
    border-radius:50%;

    background:transparent;

    cursor:pointer;
    z-index:30;
}


/* نبضة عند الضغط */

.seal-pulse{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%) scale(.5);

    width:105px;
    height:105px;

    border-radius:50%;

    border:2px solid rgba(180,130,45,.65);

    opacity:0;

    pointer-events:none;

    z-index:25;
}

#coverPage.preparing .seal-pulse{
    animation:sealPulse .7s ease;
}

@keyframes sealPulse{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    40%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.8);
    }
}


/* فتح الغلاف للأعلى */

#coverPage.open .cover-image{

    transform:
        translateY(-105%)
        scale(.98);

    opacity:0;
}


/* =========================
   زر الموسيقى
========================= */

.music-button{

    position:fixed;

    top:18px;
    right:18px;

    width:46px;
    height:46px;

    border-radius:50%;

    border:
        1px solid rgba(168,122,39,.55);

    background:
        rgba(255,248,236,.95);

    color:#94681c;

    font-size:21px;

    display:none;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:1000;

    box-shadow:
        0 4px 14px rgba(0,0,0,.14);
}

.music-button.visible{
    display:flex;
}


/* =========================
   سهم السحب
========================= */

.swipe-hint{

    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:900;

    display:none;

    flex-direction:column;
    align-items:center;

    padding:7px 14px;

    border-radius:25px;

    background:
        rgba(255,248,236,.92);

    color:#8c651f;

    font-size:12px;

    pointer-events:none;

    animation:moveUp 1.3s infinite;
}

.swipe-hint.visible{
    display:flex;
}

.swipe-hint strong{
    font-size:22px;
    line-height:18px;
    font-weight:normal;
}

@keyframes moveUp{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-8px);
    }
}


/* =========================
   نقاط الصفحات
========================= */

.dots{

    position:fixed;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    z-index:900;

    display:none;

    flex-direction:column;

    gap:10px;
}

.dots.visible{
    display:flex;
}

.dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:
        rgba(142,101,29,.3);

    transition:.3s;
}

.dot.active{

    background:#95681c;

    transform:scale(1.5);
}


/* =========================
   زر الموقع
========================= */

.map-button{

    position:absolute;

    left:25%;
    width:50%;

    top:71%;
    height:11%;

    border:none;
    background:transparent;

    cursor:pointer;

    z-index:50;
}


/* الكمبيوتر */

@media(min-width:501px){

    .invitation{

        box-shadow:
            0 0 30px rgba(0,0,0,.12);
    }
}

</style>
</head>


<body>


<main
    class="invitation"
    id="invitation"
>


<!-- =====================
     1 - الغلاف الجديد
===================== -->

<section
    class="page"
    id="coverPage"
>

    <img
        src="./cover3.png"
        class="cover-image"
        alt="غلاف الدعوة"
    >

    <div
        class="seal-pulse">
    </div>

    <button
        class="seal-button"
        id="openInvitation"
        aria-label="فتح الدعوة">
    </button>

</section>



<!-- =====================
     2 - صفحة العرس
===================== -->

<section
    class="page"
    id="weddingPage"
>

    <img
        src="./wedding.png"
        alt="دعوة حفل الزفاف"
    >

</section>



<!-- =====================
     3 - صفحة الحنة
===================== -->

<section
    class="page"
    id="hennaPage"
>

    <img
        src="./hanna2.png"
        alt="ليلة الحنة"
    >

</section>



<!-- =====================
     4 - العد التنازلي
===================== -->

<section
    class="page"
    id="countdownPage"
>

    <img
        src="./countdown.png"
        alt="العد التنازلي"
    >

    <button
        class="map-button"
        id="mapButton"
        aria-label="فتح الموقع">
    </button>

</section>


</main>



<!-- =====================
     الموسيقى الجديدة
===================== -->

<audio
    id="music"
    loop
    preload="auto"
>

    <source
        src="./music35.mp3"
        type="audio/mpeg"
    >

</audio>


<button
    class="music-button"
    id="musicButton"
    aria-label="تشغيل أو إيقاف الموسيقى"
>
♫
</button>



<!-- سهم السحب -->

<div
    class="swipe-hint"
    id="swipeHint"
>

    <strong>↑</strong>

    <span>
        اسحب للأعلى
    </span>

</div>



<!-- نقاط الصفحات -->

<div
    class="dots"
    id="dots"
>

    <span class="dot active"></span>

    <span class="dot"></span>

    <span class="dot"></span>

</div>



<script>

const invitation =
    document.getElementById("invitation");

const coverPage =
    document.getElementById("coverPage");

const openInvitation =
    document.getElementById("openInvitation");

const weddingPage =
    document.getElementById("weddingPage");

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

const swipeHint =
    document.getElementById("swipeHint");

const dotsBox =
    document.getElementById("dots");

const dots =
    document.querySelectorAll(".dot");

const mapButton =
    document.getElementById("mapButton");

let opened = false;


/* =========================
   فتح الدعوة
========================= */

openInvitation.addEventListener(
    "click",
    function(){

        if(opened){
            return;
        }

        opened = true;


        /* نبضة على الختم */

        coverPage.classList.add(
            "preparing"
        );


        /* تشغيل الموسيقى */

        music.volume = 0.45;

        music.play().catch(function(){

            console.log(
                "المتصفح منع تشغيل الموسيقى"
            );

        });


        /* فتح الغلاف */

        setTimeout(function(){

            coverPage.classList.add(
                "open"
            );

            musicButton.classList.add(
                "visible"
            );

        },500);


        /* الانتقال عمودياً للصفحة الثانية */

        setTimeout(function(){

            weddingPage.scrollIntoView({

                behavior:"smooth",

                block:"start"

            });


            swipeHint.classList.add(
                "visible"
            );


            dotsBox.classList.add(
                "visible"
            );

        },1200);

    }
);


/* =========================
   الموسيقى
========================= */

musicButton.addEventListener(
    "click",
    function(){

        if(music.paused){

            music.play();

            musicButton.textContent =
                "♫";

        }

        else{

            music.pause();

            musicButton.textContent =
                "♪";

        }

    }
);


/* =========================
   متابعة الصفحة الحالية
========================= */

invitation.addEventListener(
    "scroll",
    function(){

        if(!opened){
            return;
        }


        const pageHeight =
            invitation.clientHeight;


        const currentPage =
            Math.round(
                invitation.scrollTop /
                pageHeight
            );


        dots.forEach(function(dot){

            dot.classList.remove(
                "active"
            );

        });


        /*
        الصفحة 1 = الغلاف
        الصفحة 2 = العرس
        الصفحة 3 = الحنة
        الصفحة 4 = العد
        */

        const dotIndex =
            currentPage - 1;


        if(
            dotIndex >= 0 &&
            dots[dotIndex]
        ){

            dots[dotIndex]
                .classList
                .add("active");

        }


        /* إخفاء السهم بآخر صفحة */

        if(currentPage >= 3){

            swipeHint
                .classList
                .remove("visible");

        }

        else if(currentPage >= 1){

            swipeHint
                .classList
                .add("visible");

        }

    }
);


/* =========================
   فتح موقع القاعة
========================= */

mapButton.addEventListener(
    "click",
    function(){

        window.open(
            "https://www.google.com/maps/search/?api=1&query=Ramallah",
            "_blank"
        );

    }
);

</script>


</body>
</html>
