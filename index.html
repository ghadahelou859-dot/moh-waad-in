<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دعوة محمد ووعد</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f4ecdf;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .invitation {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      margin: auto;
      position: relative;
      overflow: hidden;
      background: #f4ecdf;
    }

    .page {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      visibility: hidden;

      transform: translateY(100%);

      transition:
        transform 0.75s ease,
        opacity 0.65s ease,
        visibility 0.75s;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      z-index: 5;
    }

    .page.above {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-100%);
    }

    .page.below {
      opacity: 0;
      visibility: hidden;
      transform: translateY(100%);
    }

    .page-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* الغلاف */
    .open-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 20;
    }

    /* الموسيقى */
    .music-button {
      position: fixed;
      top: 18px;
      right: 18px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      border-radius: 50%;
      border: 1px solid #c89b4c;

      background: rgba(255, 248, 235, 0.95);
      color: #966b20;

      font-size: 21px;

      display: none;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .music-button.visible {
      display: flex;
    }

    /* أزرار فوق وتحت */
    .nav-button {
      position: fixed;

      left: 50%;
      transform: translateX(-50%);

      z-index: 1000;

      width: 46px;
      height: 46px;

      border-radius: 50%;
      border: 1px solid rgba(160,115,35,0.45);

      background: rgba(255,248,235,0.95);
      color: #94681b;

      font-size: 24px;

      display: none;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow: 0 3px 12px rgba(0,0,0,0.16);
    }

    .nav-button.visible {
      display: flex;
    }

    #prev {
      top: 18px;
    }

    #next {
      bottom: 18px;
    }

    /* نقاط الصفحات */
    .dots {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);

      z-index: 1000;

      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .dots.visible {
      display: flex;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d5bd91;
      transition: 0.25s;
    }

    .dot.active {
      background: #986b1e;
      transform: scale(1.4);
    }

    /* زر الموقع الشفاف */
    .map-button {
      position: absolute;

      left: 27%;
      width: 46%;

      top: 72%;
      height: 9%;

      z-index: 30;

      border: 0;
      background: transparent;
      cursor: pointer;
    }

    @media (min-width: 501px) {
      body {
        background: #eee8df;
      }

      .invitation {
        box-shadow: 0 0 25px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>


<body>

  <main class="invitation">

    <!-- 1 الغلاف -->
    <section class="page active" id="coverPage">

      <img
        src="cover.png"
        class="page-image"
        alt="غلاف دعوة محمد ووعد"
      >

      <button
        class="open-cover"
        id="openCover"
        aria-label="فتح الدعوة"
      ></button>

    </section>


    <!-- 2 العرس -->
    <section class="page below" id="weddingPage">

      <img
        src="wedding.png"
        class="page-image"
        alt="حفل زفاف محمد ووعد"
      >

    </section>


    <!-- 3 الحنة -->
    <section class="page below" id="hennaPage">

      <img
        src="حناء.png"
        class="page-image"
        alt="ليلة الحنة"
      >

    </section>


    <!-- 4 الموقع والعد التنازلي -->
    <section class="page below" id="countdownPage">

      <img
        src="countdown.png"
        class="page-image"
        alt="العد التنازلي وموقع العرس"
      >

      <button
        class="map-button"
        id="mapButton"
        aria-label="فتح موقع العرس"
      ></button>

    </section>


    <!-- الموسيقى -->
    <audio id="music" loop preload="auto">

      <source
        src="موسيقى.mp3"
        type="audio/mpeg"
      >

    </audio>


    <button
      class="music-button"
      id="musicButton"
      aria-label="تشغيل أو إيقاف الموسيقى"
    >
      ♫
    </button>


    <!-- زر للأعلى -->
    <button
      class="nav-button"
      id="prev"
      aria-label="الصفحة السابقة"
    >
      ↑
    </button>


    <!-- زر للأسفل -->
    <button
      class="nav-button"
      id="next"
      aria-label="الصفحة التالية"
    >
      ↓
    </button>


    <!-- نقاط الصفحات -->
    <div class="dots" id="dots">

      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  </main>


  <script>

    const pages = [
      document.getElementById("coverPage"),
      document.getElementById("weddingPage"),
      document.getElementById("hennaPage"),
      document.getElementById("countdownPage")
    ];

    let currentPage = 0;


    const openCover =
      document.getElementById("openCover");

    const prevButton =
      document.getElementById("prev");

    const nextButton =
      document.getElementById("next");

    const dotsBox =
      document.getElementById("dots");

    const dots =
      document.querySelectorAll(".dot");

    const music =
      document.getElementById("music");

    const musicButton =
      document.getElementById("musicButton");


    /* فتح الدعوة */
    openCover.addEventListener("click", function () {

      showPage(1);

      prevButton.classList.add("visible");
      nextButton.classList.add("visible");
      dotsBox.classList.add("visible");
      musicButton.classList.add("visible");

      music.volume = 0.45;

      music.play().catch(function () {
        console.log("المتصفح منع تشغيل الموسيقى");
      });

    });


    /* عرض الصفحة */
    function showPage(pageNumber) {

      pages.forEach(function (page, index) {

        page.classList.remove(
          "active",
          "above",
          "below"
        );

        if (index < pageNumber) {
          page.classList.add("above");
        }

        if (index > pageNumber) {
          page.classList.add("below");
        }

      });


      pages[pageNumber].classList.add("active");

      currentPage = pageNumber;

      updateControls();

    }


    /* التالي = الكرت يطلع لفوق */
    nextButton.addEventListener("click", function () {

      if (currentPage < pages.length - 1) {
        showPage(currentPage + 1);
      }

    });


    /* السابق */
    prevButton.addEventListener("click", function () {

      if (currentPage > 1) {
        showPage(currentPage - 1);
      }

    });


    /* تحديث الأزرار والنقاط */
    function updateControls() {

      if (currentPage === 1) {
        prevButton.style.visibility = "hidden";
      } else {
        prevButton.style.visibility = "visible";
      }


      if (currentPage === pages.length - 1) {
        nextButton.style.visibility = "hidden";
      } else {
        nextButton.style.visibility = "visible";
      }


      dots.forEach(function (dot) {
        dot.classList.remove("active");
      });


      const dotIndex = currentPage - 1;

      if (dots[dotIndex]) {
        dots[dotIndex].classList.add("active");
      }

    }


    /* الموسيقى */
    musicButton.addEventListener("click", function () {

      if (music.paused) {

        music.play();
        musicButton.textContent = "♫";

      } else {

        music.pause();
        musicButton.textContent = "♪";

      }

    });


    /* الموقع */
    document
      .getElementById("mapButton")
      .addEventListener("click", function () {

        window.open(
          "https://www.google.com/maps/search/?api=1&query=Ramallah",
          "_blank"
        );

      });


    /* السحب لفوق وتحت بالموبايل */

    let touchStartY = 0;


    document.addEventListener(
      "touchstart",
      function (event) {

        touchStartY =
          event.changedTouches[0].screenY;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function (event) {

        if (currentPage === 0) {
          return;
        }


        const touchEndY =
          event.changedTouches[0].screenY;


        const difference =
          touchEndY - touchStartY;


        if (Math.abs(difference) < 60) {
          return;
        }


        /* سحب لفوق */
        if (difference < 0) {

          if (currentPage < pages.length - 1) {
            showPage(currentPage + 1);
          }

        }


        /* سحب لتحت */
        else {

          if (currentPage > 1) {
            showPage(currentPage - 1);
          }

        }

      },
      { passive: true }
    );

  </script>

</body>

</html>
