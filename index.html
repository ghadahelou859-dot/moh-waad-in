<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة محمد ووعد</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#eee7dd;
}

body{
  overflow:hidden;
}

/* الحاوية */
.invitation{
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;
  position:relative;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  background:#f4ecdf;

  scrollbar-width:none;
}

.invitation::-webkit-scrollbar{
  display:none;
}

/* الصفحات */
.page{
  position:relative;
  width:100%;
  height:100vh;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;
  background:#f4ecdf;
}

.page img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   الغلاف
========================= */

#coverPage{
  position:relative;
  z-index:50;
}

/* صورة الظرف */
.cover-image{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform 1.15s cubic-bezier(.77,0,.18,1),
    opacity .9s ease;
}

/* حركة فتح الظرف */
#coverPage.open .cover-image{
  transform:
    translateY(-105%)
    scale(.97);

  opacity:0;
}

/* منطقة الضغط على الختم */
.seal-button{
  position:absolute;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%);

  width:125px;
  height:125px;

  border:none;
  border-radius:50%;

  background:transparent;

  cursor:pointer;
  z-index:100;
}

/* نبضة حول الختم */
.seal-pulse{
  position:absolute;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%)
    scale(.6);

  width:100px;
  height:100px;

  border-radius:50%;

  border:
    2px solid rgba(191,142,58,.65);

  opacity:0;

  pointer-events:none;

  z-index:90;
}

#coverPage.preparing .seal-pulse{
  animation:sealPulse .7s ease;
}

@keyframes sealPulse{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.6);
  }

  40%{
    opacity:.9;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.7);
  }

}

/* =========================
   بقية الصفحات
========================= */

#weddingPage{
  opacity:.6;
  transform:translateY(10%);

  transition:
    opacity .9s ease,
    transform .9s ease;
}

body.opened #weddingPage{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   زر الموسيقى
========================= */

.music-button{
  position:fixed;

  top:18px;
  right:18px;

  z-index:1000;

  width:46px;
  height:46px;

  border-radius:50%;

  border:
    1px solid rgba(168,122,39,.55);

  background:
    rgba(255,248,236,.95);

  color:#94681c;

  font-size:21px;

  display:none;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.14);
}

.music-button.visible{
  display:flex;
}

/* =========================
   اسحب للأعلى
========================= */

.swipe-hint{
  position:fixed;

  bottom:17px;
  left:50%;

  transform:translateX(-50%);

  z-index:900;

  display:none;

  flex-direction:column;
  align-items:center;

  padding:7px 14px;

  border-radius:25px;

  background:
    rgba(255,248,236,.9);

  color:#8c651f;

  font-size:12px;

  pointer-events:none;

  animation:hintMove 1.4s infinite;
}

.swipe-hint.visible{
  display:flex;
}

.swipe-hint strong{
  font-size:21px;
  font-weight:normal;
  line-height:17px;
}

@keyframes hintMove{

  0%,100%{
    transform:
      translateX(-50%)
      translateY(0);
  }

  50%{
    transform:
      translateX(-50%)
      translateY(-7px);
  }

}

/* =========================
   نقاط الصفحات
========================= */

.dots{
  position:fixed;

  right:13px;
  top:50%;

  transform:translateY(-50%);

  z-index:900;

  display:none;

  flex-direction:column;
  gap:9px;
}

.dots.visible{
  display:flex;
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    rgba(142,101,29,.28);

  transition:.3s;
}

.dot.active{
  background:#95681c;
  transform:scale(1.4);
}

/* =========================
   زر الموقع
========================= */

.map-button{
  position:absolute;

  left:27%;
  width:46%;

  top:72%;
  height:9%;

  z-index:40;

  border:none;
  background:transparent;

  cursor:pointer;
}

/* الكمبيوتر */
@media(min-width:501px){

  .invitation{
    box-shadow:
      0 0 30px rgba(0,0,0,.12);
  }

}

</style>
</head>


<body>


<main
class="invitation"
id="invitation"
>


<!-- 1 الغلاف -->

<section
class="page"
id="coverPage"
>

<img
src="cover3.png"
class="cover-image"
alt="غلاف الدعوة"
>

<div
class="seal-pulse">
</div>

<button
class="seal-button"
id="openInvitation"
aria-label="فتح الدعوة">
</button>

</section>



<!-- 2 العرس -->

<section
class="page"
id="weddingPage"
>

<img
src="wedding.png"
alt="معلومات حفل الزفاف"
>

</section>



<!-- 3 الحنة -->

<section
class="page"
id="hennaPage"
>

<img
src="hanna2.png"
alt="ليلة الحنة"
>

</section>



<!-- 4 العد التنازلي -->

<section
class="page"
id="countdownPage"
>

<img
src="countdown.png"
alt="العد التنازلي وموقع العرس"
>

<button
class="map-button"
id="mapButton"
aria-label="فتح الموقع">
</button>

</section>


</main>



<!-- الموسيقى -->

<audio
id="music"
loop
preload="auto"
>

<source
src="music35.mp3"
type="audio/mpeg"
>

</audio>


<button
class="music-button"
id="musicButton"
>
♫
</button>



<!-- مؤشر السحب -->

<div
class="swipe-hint"
id="swipeHint"
>

<strong>↑</strong>

<span>
اسحب للأعلى
</span>

</div>



<!-- النقاط -->

<div
class="dots"
id="dots"
>

<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>



<script>

const invitation =
document.getElementById("invitation");

const coverPage =
document.getElementById("coverPage");

const openInvitation =
document.getElementById("openInvitation");

const weddingPage =
document.getElementById("weddingPage");

const music =
document.getElementById("music");

const musicButton =
document.getElementById("musicButton");

const swipeHint =
document.getElementById("swipeHint");

const dotsBox =
document.getElementById("dots");

const dots =
document.querySelectorAll(".dot");

let opened = false;


/* =========================
   فتح الظرف
========================= */

openInvitation.addEventListener(
"click",
function(){

  if(opened){
    return;
  }

  opened = true;


  /* نبضة الختم */

  coverPage
  .classList
  .add("preparing");


  /* الموسيقى */

  music.volume=.45;

  music.play().catch(function(){
    console.log(
      "تعذر تشغيل الموسيقى تلقائياً"
    );
  });


  /* بعد النبضة يبدأ الفتح */

  setTimeout(function(){

    coverPage
    .classList
    .add("open");

    document.body
    .classList
    .add("opened");

    musicButton
    .classList
    .add("visible");

    dotsBox
    .classList
    .add("visible");

  },500);


  /* الانتقال للعرس */

  setTimeout(function(){

    weddingPage
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    swipeHint
    .classList
    .add("visible");

  },1200);

});


/* =========================
   الموسيقى
========================= */

musicButton.addEventListener(
"click",
function(){

  if(music.paused){

    music.play();
    musicButton.textContent="♫";

  }else{

    music.pause();
    musicButton.textContent="♪";

  }

});


/* =========================
   تحديث الصفحات
========================= */

invitation.addEventListener(
"scroll",
function(){

  if(!opened){
    return;
  }


  const pageHeight =
  invitation.clientHeight;


  const currentPage =
  Math.round(
    invitation.scrollTop
    /
    pageHeight
  );


  dots.forEach(function(dot){

    dot.classList
    .remove("active");

  });


  if(currentPage >= 1){

    const dotIndex =
    currentPage - 1;


    if(dots[dotIndex]){

      dots[dotIndex]
      .classList
      .add("active");

    }

  }


  if(currentPage >= 3){

    swipeHint
    .classList
    .remove("visible");

  }

  else if(currentPage >=1){

    swipeHint
    .classList
    .add("visible");

  }

});


/* =========================
   الموقع
========================= */

document
.getElementById("mapButton")
.addEventListener(
"click",
function(){

  window.open(
    "https://www.google.com/maps/search/?api=1&query=Ramallah",
    "_blank"
  );

});

</script>


</body>
</html>
